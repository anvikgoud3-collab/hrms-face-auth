<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Login Demo</title>
    <style>
    body { font-family: Arial; max-width: 480px; margin: 30px auto; text-align: center; }
    video { width: 100%; border-radius: 12px; transform: scaleX(-1); }
    button { padding: 10px 16px; margin: 6px; cursor: pointer; }
    #status { margin: 12px; font-weight: bold; }

    #camBox { position: relative; overflow: hidden; border-radius: 12px; line-height: 0; }
    #camBox video { display: block; }
    #ring {
      position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
      height: 80%; aspect-ratio: 1; border-radius: 50%;
      border: 3px solid #4ade80;                      /* green */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);    /* darkens everything outside the circle */
      pointer-events: none;
      transition: border-color 0.2s;
    }
    #ring.bad { border-color: #ef4444; }              /* red */
    #hint { margin: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Face Login (Demo)</h2>
  <input id="empId" placeholder="Employee ID, e.g. EMP001">
      <div id="camBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="ring" class="bad"></div>
  </div>
  <p id="hint">Looking for your face...</p>
  <canvas id="canvas" style="display:none"></canvas>
  <p id="status">Starting camera...</p>

    <button id="enrollBtn">Register my face</button>
  <button id="loginBtn">Sign in with face</button>
  <button id="attendBtn">Mark attendance</button>

  <div id="fallback" style="display:none">
    <p>Face not recognised. Please use your password:</p>
    <input type="password" placeholder="Password">
    <button>Login</button>
  </div>
  <h3>Today's attendance</h3>
  <table border="1" cellpadding="6" style="margin:auto">
    <thead><tr><th>Employee</th><th>In</th><th>Out</th></tr></thead>
    <tbody id="attBody"></tbody>
  </table>

<script>
  const API = "";   // same server. Your team will put the API address here.
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const statusEl = document.getElementById("status");
  const fallback = document.getElementById("fallback");

  const setStatus = (text) => (statusEl.textContent = text);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 1. Turn the camera on
  navigator.mediaDevices.getUserMedia({ video: true })
    .then((stream) => { video.srcObject = stream; setStatus("Camera ready"); })
    .catch(() => setStatus("Camera blocked. Please allow camera access."));

  // 2. Take one picture from the video
    function takePhoto() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const side = Math.round(vh * 0.8);        // same size as the circle on screen
    const sx = Math.round((vw - side) / 2);
    const sy = Math.round((vh - side) / 2);
    const out = 480;                          // size sent to the server

    canvas.width = out;
    canvas.height = out;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, out, out);             // everything starts black
    ctx.save();
    ctx.beginPath();
    ctx.arc(out / 2, out / 2, out / 2, 0, Math.PI * 2);
    ctx.clip();                               // only the circle area is kept
    ctx.drawImage(video, sx, sy, side, side, 0, 0, out, out);
    ctx.restore();
    return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
  }

  // 3. Take several pictures, one after another
    async function capture(count, delay, message) {
    capturing = true;               // pause the live circle check
    const photos = [];
    try {
      for (let i = 0; i < count; i++) {
        setStatus(message + " (" + (i + 1) + "/" + count + ")");
        photos.push(await takePhoto());
        await wait(delay);
      }
    } finally {
      capturing = false;            // resume it
    }
    return photos;
  }

  // 4. Send the pictures to the Python API
  async function send(endpoint, photos) {
    const form = new FormData();
    form.append("employee_id", document.getElementById("empId").value.trim());
    photos.forEach((p, i) => form.append("images", p, "photo" + i + ".jpg"));
    const res = await fetch(API + endpoint, { method: "POST", body: form });
    return res.json();
  }

  // Register button
  document.getElementById("enrollBtn").onclick = async () => {
    if (!document.getElementById("empId").value.trim()) return setStatus("Enter your employee ID first");
    try {
      const photos = await capture(5, 800, "Look at the camera, turn your head slightly");
      setStatus("Saving...");
      const result = await send("/enroll", photos);
      setStatus(result.ok ? "Face registered ✅" : result.message);
    } catch (e) {
      setStatus("Could not reach the server");
    }
  };

  // Sign-in button
  document.getElementById("loginBtn").onclick = async () => {
    if (!document.getElementById("empId").value.trim()) return setStatus("Enter your employee ID first");
    fallback.style.display = "none";
    try {
      const photos = await capture(3, 700, "Look at the camera");
      setStatus("Checking...");
      const result = await send("/verify", photos);
      if (result.matched) {
        setStatus("Face matched ✅ You are logged in");
      } else {
        setStatus("Face not recognised");
        fallback.style.display = "block";   // password login is always available
      }
    } catch (e) {
      setStatus("Could not reach the server");
      fallback.style.display = "block";
    }
  };
    // Attendance: show today's table
  async function loadAttendance() {
    const res = await fetch(API + "/attendance/today");
    const data = await res.json();
    const body = document.getElementById("attBody");
    body.innerHTML = "";
    data.records.forEach((r) => {
      const row = body.insertRow();
      [r.employee_id, r.check_in, r.check_out || "-"].forEach((v) => {
        row.insertCell().textContent = v;
      });
    });
  }

  // Attendance button
  document.getElementById("attendBtn").onclick = async () => {
    if (!document.getElementById("empId").value.trim()) return setStatus("Enter your employee ID first");
    try {
      const photos = await capture(3, 700, "Look at the camera");
      setStatus("Checking...");
      const result = await send("/attendance/mark", photos);
      if (result.ok) {
        const messages = {
          check_in: "Checked in at " + result.time + " ✅",
          check_out: "Checked out at " + result.time + " ✅",
          too_soon: "Already checked in at " + result.time + ". Wait a minute to check out.",
          already_done: "Already checked out today at " + result.time,
        };
        setStatus(messages[result.action]);
        loadAttendance();
      } else {
        setStatus("Face not recognised (" + result.reason + ")");
      }
    } catch (e) {
      setStatus("Could not reach the server");
    }
  };
  // Live face guide: circle is green only when exactly one clear face is inside it
  const ring = document.getElementById("ring");
  const hint = document.getElementById("hint");
  let capturing = false;

  async function checkFace() {
    if (!capturing && video.videoWidth > 0) {
      try {
        const blob = await takePhoto();
        const form = new FormData();
        form.append("image", blob, "check.jpg");
        const res = await fetch(API + "/detect", { method: "POST", body: form });
        const data = await res.json();

        ring.classList.toggle("bad", !data.ok);
        if (data.ok) {
          hint.textContent = "Face OK ✅";
        } else if (data.faces_found > 1) {
          hint.textContent = "Only one face inside the circle, please";
        } else {
          hint.textContent = "Move your face into the circle, look at the camera, use good light";
        }
      } catch (e) {
        ring.classList.add("bad");
        hint.textContent = "Cannot reach the server";
      }
    }
    setTimeout(checkFace, 800);   // check again 0.8 seconds after this one finishes
  }
  checkFace();
  loadAttendance();

</script>
</body>
</html>
